# RGNR8 — Render Blueprint (Infrastructure as Code).
#
# One `Apply Blueprint` in the Render dashboard stands up the whole hosted stack:
#   - rgnr8-db      managed PostgreSQL 16 (daily backups)
#   - rgnr8-ledger  the accounting system of record (Node/TS), PRIVATE — never
#                   reachable from the internet, only by the web app + worker
#   - rgnr8-web     the owner web app + API (Python/gunicorn), public
#   - rgnr8-worker  the delivery worker (briefings + webhook outbox), on a cron
#
# Shared secrets (the JWT signing key, the session key, and the web<->ledger
# token) are generated by Render server-side (`generateValue`) and referenced
# between services (`fromService`), so no human ever handles them. The ONE secret
# you paste at apply time is RGNR8_SECRET_KEY — the Fernet key that encrypts QBO
# tokens at rest — which you must also back up separately from the database.
#
# Ports: every Render service is routed on $PORT (10000), so each process is told
# to listen there. Region + plans match the "lean beta" choice; scale later by
# editing `plan` here (or in the dashboard) — no code change needed.

databases:
  - name: rgnr8-db
    plan: basic_256mb
    region: oregon
    postgresMajorVersion: "16"

services:
  # --- the ledger: private, internal-only accounting system of record ---------
  - type: pserv
    name: rgnr8-ledger
    runtime: docker
    repo: https://github.com/JasonLuciani/rgnr8
    branch: main
    region: oregon
    plan: starter
    dockerfilePath: ./deploy/Dockerfile.ledger
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: RGNR8_LEDGER_PORT
        value: "10000"          # bind Render's routed port
      - key: RGNR8_LEDGER_TOKEN
        generateValue: true      # the shared secret the web app presents
      - key: DATABASE_URL
        fromDatabase:
          name: rgnr8-db
          property: connectionString

  # --- the owner web app + API: public ----------------------------------------
  - type: web
    name: rgnr8-web
    runtime: docker
    repo: https://github.com/JasonLuciani/rgnr8
    branch: main
    region: oregon
    plan: starter
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /ready
    domains:
      - acctg.rgnr8ventures.com
    # Release phase: run the (idempotent) Python schema migration before the new
    # version takes traffic. The TS ledger self-migrates on boot under its own
    # advisory lock, so the two never race.
    preDeployCommand: python migrate.py
    envVars:
      - key: RGNR8_PORT
        value: "10000"
      - key: RGNR8_AUTH_MODE
        value: hs256
      - key: RGNR8_JWT_SECRET
        generateValue: true
      - key: RGNR8_SESSION_SECRET
        generateValue: true
      # The at-rest encryption key. sync:false → you paste it at Apply time (the
      # value is generated for you) and back it up separately from the DB.
      - key: RGNR8_SECRET_KEY
        sync: false
      - key: RGNR8_DATABASE_URL
        fromDatabase:
          name: rgnr8-db
          property: connectionString
      - key: RGNR8_LEDGER_URL
        value: http://rgnr8-ledger:10000
      - key: RGNR8_LEDGER_TOKEN
        fromService:
          type: pserv
          name: rgnr8-ledger
          envVarKey: RGNR8_LEDGER_TOKEN
      - key: RGNR8_SECURE_COOKIES
        value: "true"

  # --- the operator console: RGNR8-staff control plane (onboard businesses) ----
  # Public, but every route requires a platform (staff) role. Shares the owner
  # app's DB, JWT secret, and ledger, so one account works on both sides and the
  # fleet the operator provisions is the fleet the owner app serves.
  - type: web
    name: rgnr8-operator
    runtime: docker
    repo: https://github.com/JasonLuciani/rgnr8
    branch: main
    region: oregon
    plan: starter
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    dockerCommand: gunicorn operator_entry:application --workers 2 --bind 0.0.0.0:10000 --access-logfile -
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: RGNR8_PORT
        value: "10000"
      - key: RGNR8_AUTH_MODE
        value: hs256
      - key: RGNR8_JWT_SECRET
        fromService:
          type: web
          name: rgnr8-web
          envVarKey: RGNR8_JWT_SECRET
      - key: RGNR8_DATABASE_URL
        fromDatabase:
          name: rgnr8-db
          property: connectionString
      - key: RGNR8_LEDGER_URL
        value: http://rgnr8-ledger:10000
      - key: RGNR8_LEDGER_TOKEN
        fromService:
          type: pserv
          name: rgnr8-ledger
          envVarKey: RGNR8_LEDGER_TOKEN
      - key: RGNR8_SECURE_COOKIES
        value: "true"

  # --- the delivery worker: briefings + durable webhook outbox, on a schedule --
  - type: cron
    name: rgnr8-worker
    runtime: docker
    repo: https://github.com/JasonLuciani/rgnr8
    branch: main
    region: oregon
    schedule: "*/15 * * * *"    # every 15 minutes; a missed tick just delivers next run
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    dockerCommand: python worker.py
    autoDeploy: true
    envVars:
      # The worker has no interactive auth surface, so it needs no JWT secret;
      # static mode satisfies config without one (hs256 would demand a secret).
      - key: RGNR8_AUTH_MODE
        value: static
      - key: RGNR8_DATABASE_URL
        fromDatabase:
          name: rgnr8-db
          property: connectionString
      - key: RGNR8_LEDGER_URL
        value: http://rgnr8-ledger:10000
      - key: RGNR8_LEDGER_TOKEN
        fromService:
          type: pserv
          name: rgnr8-ledger
          envVarKey: RGNR8_LEDGER_TOKEN
