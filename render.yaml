# RGNR8 — Render Blueprint (Infrastructure as Code).
#
# Stands up the whole hosted stack in one Apply/sync:
#   - rgnr8-db        managed PostgreSQL 16 (daily backups)
#   - rgnr8-ledger    accounting system of record (Node/TS), PRIVATE
#   - rgnr8-web       owner web app + API AND the RGNR8-staff operator console, from
#                     ONE Python/gunicorn service: deploy/combined_entry.py dispatches
#                     /operator/* to the console and everything else to the owner app,
#                     so both sit behind one login @ acctg.rgnr8ventures.com
#   - rgnr8-worker    delivery worker (briefings + webhook outbox), on a cron
#
# Design notes (each guarded by tests/test_render_blueprint.py):
#   - RGNR8_JWT_SECRET lives in the shared env group so every Python service signs
#     and validates with ONE key (the operator mints tenant tokens the web reads).
#   - RGNR8_SECRET_KEY (Fernet, at-rest) is sync:false and pasted by hand on the
#     services that cipher — web (encrypts) and worker (decrypts) — never generated.
#   - RGNR8_LEDGER_URL is fromService hostport, never hardcoded: Render private
#     hostnames carry a random suffix, so the real address isn't knowable up front.
#   - Every service + the database sit in one region (Render's private net is regional).

databases:
  - name: rgnr8-db
    plan: basic_256mb
    region: oregon
    postgresMajorVersion: "16"

# One generated JWT key shared by every Python service, plus the founder bootstrap
# email (promoted to a staff role on first sign-in). Groups can't hold sync:false.
envVarGroups:
  - name: rgnr8-shared
    envVars:
      - key: RGNR8_JWT_SECRET
        generateValue: true
      - key: RGNR8_BOOTSTRAP_STAFF_EMAIL
        value: jasonluciani1@gmail.com

services:
  # --- the ledger: private, internal-only accounting system of record ---------
  - type: pserv
    name: rgnr8-ledger
    runtime: docker
    repo: https://github.com/JasonLuciani/rgnr8
    branch: main
    region: oregon
    plan: starter
    dockerfilePath: ./deploy/Dockerfile.ledger
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: RGNR8_LEDGER_PORT
        value: "10000"
      - key: RGNR8_LEDGER_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rgnr8-db
          property: connectionString

  # --- the owner web app + API: public, on the custom domain ------------------
  - type: web
    name: rgnr8-web
    runtime: docker
    repo: https://github.com/JasonLuciani/rgnr8
    branch: main
    region: oregon
    plan: starter
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    autoDeploy: true
    # Serve BOTH apps from this one public service: the combined entrypoint routes
    # /operator/* to the staff console and everything else to the owner app, so
    # acctg.rgnr8ventures.com is the single front door — one login, one origin.
    dockerCommand: gunicorn combined_entry:application --workers 2 --bind 0.0.0.0:10000 --access-logfile -
    healthCheckPath: /ready
    domains:
      - acctg.rgnr8ventures.com
    preDeployCommand: python migrate.py
    envVars:
      - key: RGNR8_PORT
        value: "10000"
      - key: RGNR8_AUTH_MODE
        value: hs256
      - fromGroup: rgnr8-shared
      - key: RGNR8_SESSION_SECRET
        generateValue: true
      - key: RGNR8_SECRET_KEY
        sync: false
      - key: RGNR8_DATABASE_URL
        fromDatabase:
          name: rgnr8-db
          property: connectionString
      - key: RGNR8_LEDGER_URL
        fromService:
          type: pserv
          name: rgnr8-ledger
          property: hostport
      - key: RGNR8_LEDGER_TOKEN
        fromService:
          type: pserv
          name: rgnr8-ledger
          envVarKey: RGNR8_LEDGER_TOKEN
      - key: RGNR8_SECURE_COOKIES
        value: "true"
      - key: RGNR8_OPERATOR_URL
        # Same origin now: this very service serves the console at /operator (the
        # combined entrypoint), so staff-with-no-business and the post-login view
        # chooser link stay on acctg instead of bouncing to the onrender URL.
        value: /operator
      # --- QuickBooks Online connect ------------------------------------------
      # The Client ID + Secret are pasted by hand (sync:false) so they never pass
      # through source control or a tool. The redirect URI must match EXACTLY what
      # is registered on the Intuit app. RGNR8_SECRET_KEY (above) encrypts the
      # OAuth tokens at rest and is REQUIRED whenever QBO is enabled — the app
      # refuses to store tokens in cleartext. Start in `sandbox` (a test QuickBooks
      # company); switch to `production` once Intuit approves the app.
      - key: RGNR8_QBO_CLIENT_ID
        sync: false
      - key: RGNR8_QBO_CLIENT_SECRET
        sync: false
      - key: RGNR8_QBO_REDIRECT_URI
        value: https://acctg.rgnr8ventures.com/oauth/qbo/callback
      - key: RGNR8_QBO_ENVIRONMENT
        value: sandbox

  # --- the delivery worker: briefings + durable webhook outbox, on a schedule --
  - type: cron
    name: rgnr8-worker
    runtime: docker
    repo: https://github.com/JasonLuciani/rgnr8
    branch: main
    region: oregon
    schedule: "*/15 * * * *"
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    dockerCommand: python worker.py
    autoDeploy: true
    envVars:
      - key: RGNR8_AUTH_MODE
        value: hs256
      - fromGroup: rgnr8-shared
      # Decrypts webhook endpoint secrets the web app encrypted — same Fernet key.
      - key: RGNR8_SECRET_KEY
        sync: false
      # Without a SendGrid key the worker runs forever and delivers nothing; set it
      # to actually send briefings (leave blank in early beta to no-op safely).
      - key: RGNR8_SENDGRID_API_KEY
        sync: false
      - key: RGNR8_DATABASE_URL
        fromDatabase:
          name: rgnr8-db
          property: connectionString
      - key: RGNR8_LEDGER_URL
        fromService:
          type: pserv
          name: rgnr8-ledger
          property: hostport
      - key: RGNR8_LEDGER_TOKEN
        fromService:
          type: pserv
          name: rgnr8-ledger
          envVarKey: RGNR8_LEDGER_TOKEN
