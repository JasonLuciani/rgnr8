[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgnr8-qbo"
version = "0.1.0"
description = "RGNR8 QuickBooks Online connect — the OAuth 2.0 acquisition flow (authorize URL, code exchange, token refresh, revoke) plus per-tenant connection persistence. HTTP is an injected seam so the whole flow is deterministic and testable with no network and no real credentials."
requires-python = ">=3.11"
dependencies = []
license = { text = "UNLICENSED" }

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"
