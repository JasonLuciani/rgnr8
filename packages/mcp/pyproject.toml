[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgnr8-mcp"
version = "0.1.0"
description = "RGNR8 MCP server — an agent-native adapter exposing the owner surface as MCP tools over the same RBAC-gated web API."
requires-python = ">=3.11"
dependencies = ["rgnr8-web>=0.1.0", "rgnr8-forecast>=0.1.0", "rgnr8-briefing>=0.1.0"]
license = { text = "UNLICENSED" }

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../web/src", "../forecast/src", "../briefing/src", "../obs/src", "../scenario/src", "../ar/src", "../categorize/src", "../reports/src", "../recon-monitor/src", "../billing/src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src:../obs/src:../web/src:../forecast/src:../briefing/src:../scenario/src:../ar/src:../categorize/src:../reports/src:../recon-monitor/src:../billing/src"

# reportlab / openpyxl (pulled in transitively via rgnr8-reports' export
# renderers) ship no type information.
[[tool.mypy.overrides]]
module = ["reportlab.*", "openpyxl.*"]
ignore_missing_imports = true
