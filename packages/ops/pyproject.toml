[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgnr8-ops"
version = "0.1.0"
description = "RGNR8 operator layer — onboard beta tenants and watch the fleet (per-client cash status, close, and delivery) from one dashboard."
requires-python = ">=3.11"
dependencies = ["rgnr8-forecast>=0.1.0", "rgnr8-briefing>=0.1.0", "rgnr8-web>=0.1.0", "rgnr8-runtime>=0.1.0", "rgnr8-billing>=0.1.0", "rgnr8-alerts>=0.1.0", "rgnr8-recon-monitor>=0.1.0", "rgnr8-analytics>=0.1.0"]
license = { text = "UNLICENSED" }

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../forecast/src", "../briefing/src", "../web/src", "../ocr/src", "../runtime/src", "../billing/src", "../obs/src", "../alerts/src", "../recon-monitor/src", "../analytics/src", "../scenario/src", "../ar/src", "../categorize/src", "../reports/src", "../qbo/src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src:../obs/src:../forecast/src:../briefing/src:../web/src:../ocr/src:../runtime/src:../billing/src:../alerts/src:../recon-monitor/src:../analytics/src:../scenario/src:../ar/src:../categorize/src:../reports/src:../qbo/src"

# reportlab / openpyxl (pulled in transitively via rgnr8-reports' export
# renderers) ship no type information.
[[tool.mypy.overrides]]
module = ["reportlab.*", "openpyxl.*"]
ignore_missing_imports = true
