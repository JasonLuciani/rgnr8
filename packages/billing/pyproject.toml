[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgnr8-billing"
version = "0.1.0"
description = "RGNR8 billing — accounts, plans/entitlements, subscriptions, usage metering, and invoicing, with a Stripe-shaped provider seam."
requires-python = ">=3.11"
dependencies = ["rgnr8-forecast>=0.1.0"]
license = { text = "UNLICENSED" }

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../forecast/src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src:../forecast/src"
