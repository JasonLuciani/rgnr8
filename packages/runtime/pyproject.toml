[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgnr8-runtime"
version = "0.1.0"
description = "RGNR8 delivery runtime — a long-running process that ticks the weekly-briefing scheduler with durable subscription state, building each due tenant's validated briefing and delivering it."
requires-python = ">=3.11"
dependencies = ["rgnr8-forecast>=0.1.0", "rgnr8-briefing>=0.1.0"]
license = { text = "UNLICENSED" }

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../forecast/src", "../briefing/src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src:../forecast/src:../briefing/src"
