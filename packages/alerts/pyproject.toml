[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgnr8-alerts"
version = "0.1.0"
description = "RGNR8 proactive-alert engine — evaluate rules against a ForecastResult, emit deduped severity-ranked alerts, and deliver them through an injected sink (email/push/webhook seam). The scheduler calls dispatch(evaluate(forecast, rules)) each tick."
requires-python = ">=3.11"
dependencies = ["rgnr8-forecast>=0.1.0", "rgnr8-briefing>=0.1.0"]
license = { text = "UNLICENSED" }

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../forecast/src", "../briefing/src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src:../forecast/src:../briefing/src"
