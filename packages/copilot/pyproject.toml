[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgnr8-copilot"
version = "0.1.0"
description = "Ask RGNR8 — the conversational finance layer. An LLM picks tools; RGNR8's own engines compute every number; every figure is cited; a numeric-integrity backstop rejects any answer figure that doesn't trace to a tool result. Provider-agnostic (Protocol seam + Fake); read-first, write-gated."
requires-python = ">=3.11"
dependencies = []
license = { text = "UNLICENSED" }

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"
