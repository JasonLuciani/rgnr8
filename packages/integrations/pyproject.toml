[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgnr8-integrations"
version = "0.1.0"
description = "RGNR8 external integrations — provider-agnostic adapters for bank feeds (Plaid), payments (Stripe), payroll (Gusto) and bill-pay, each a seam over an injected HTTP client that maps a provider's data into RGNR8's existing ledger paths. Shape-correct with no network; supplying credentials + a real client turns each live."
requires-python = ">=3.11"
dependencies = []
license = { text = "UNLICENSED" }

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = "src"
