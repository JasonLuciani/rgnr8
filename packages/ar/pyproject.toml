[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rgnr8-ar"
version = "0.1.0"
description = "RGNR8 AR / collections — from open invoices, produce aging buckets, a prioritized chase list, collection-nudge drafts, and an AR report (totals + DSO). Deterministic (injected as_of), stdlib only, built on rgnr8-forecast's Money + invoice shapes."
requires-python = ">=3.11"
dependencies = ["rgnr8-forecast>=0.1.0"]
license = { text = "UNLICENSED" }

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../forecast/src"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
mypy_path = ["src", "../forecast/src"]
