name: CI

# The full battery on every push and PR: lint, typecheck, build, and test both
# the TypeScript and Python sides — including the real-PostgreSQL suite against a
# service container, so the row-level-security and durability tests that only run
# on a real engine are enforced, not just the in-memory fakes.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (build, lint, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rgnr8
          POSTGRES_PASSWORD: rgnr8
          POSTGRES_DB: rgnr8_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rgnr8"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - name: Lint (Biome)
        run: npx biome lint packages/*/src packages/*/test
      - name: Build all packages (dependency order)
        # Packages resolve each other through their built dist/, so they must be
        # compiled in dependency order — `npm run build --workspaces` uses
        # directory order and fails on a fresh checkout. This script topo-sorts.
        run: npm run build
      - name: Test all packages (in-memory)
        run: npm run test --workspaces --if-present
      - name: Real-PostgreSQL integration suite
        env:
          RGNR8_TEST_DATABASE_URL: postgres://rgnr8:rgnr8@localhost:5432/rgnr8_test
        run: node --import tsx --test packages/ledger-service/test/postgres.test.ts

  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rgnr8
          POSTGRES_PASSWORD: rgnr8
          POSTGRES_DB: rgnr8_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rgnr8"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Lets the Python-side row-level-security test (packages/ops) run against a
      # real Postgres instead of skipping; sqlite has no RLS.
      RGNR8_TEST_DATABASE_URL: postgres://rgnr8:rgnr8@localhost:5432/rgnr8_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install tools
        # pytest/mypy/ruff plus the third-party runtime deps the suites import at
        # collection time: cryptography (qbo token cipher), and reportlab +
        # openpyxl (the rgnr8-reports PDF/XLSX export renderers, pulled in by the
        # web suite too). The rgnr8-* packages themselves are resolved via each
        # pyproject's pythonpath, so only their external deps need installing here.
        run: python -m pip install --upgrade pytest mypy ruff cryptography reportlab openpyxl pyyaml "psycopg[binary]"
      - name: Lint (ruff)
        run: ruff check packages/*/src packages/*/tests
      - name: Type-check (mypy)
        run: |
          (cd packages/web && python -m mypy src)
          (cd packages/ops && python -m mypy src)
          (cd packages/qbo && python -m mypy src)
          (cd packages/ocr && python -m mypy src)
          (cd packages/integrations && python -m mypy src)
          (cd packages/apikeys && python -m mypy src)
          (cd packages/copilot && python -m mypy src)
      - name: Test every Python package
        run: |
          set -e
          for pkg in web ops qbo forecast briefing scenario ar categorize reports \
                     recon-monitor billing obs analytics runtime alerts mcp \
                     ocr integrations apikeys copilot; do
            d="packages/$pkg"
            if [ -d "$d/tests" ]; then
              echo "== $pkg =="
              (cd "$d" && python -m pytest -q)
            fi
          done

  docker-smoke:
    name: Docker build + boot smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Write a test .env for the stack
        run: |
          cat > deploy/.env <<'ENV'
          RGNR8_AUTH_MODE=hs256
          RGNR8_JWT_SECRET=ci-jwt-secret
          RGNR8_SESSION_SECRET=ci-session-secret
          RGNR8_LEDGER_TOKEN=ci-ledger-token
          ENV
      - name: Build images (web + ledger)
        run: docker compose -f deploy/docker-compose.yml build
      - name: Boot the stack
        run: docker compose -f deploy/docker-compose.yml up -d db ledger web
      - name: Wait for web /ready (fails if the image can't boot)
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8080/ready >/tmp/ready.json 2>/dev/null; then
              echo "web ready:"; cat /tmp/ready.json; exit 0
            fi
            sleep 3
          done
          echo "web never became ready"; exit 1
      - name: Web can reach the ledger over the internal network
        run: >-
          docker compose -f deploy/docker-compose.yml exec -T web
          python -c "import urllib.request,sys;
          r=urllib.request.urlopen('http://ledger:8181/health',timeout=5);
          sys.exit(0 if r.status==200 else 1)"
      - name: Migration + restore drill (pg_dump → restore → verify invariant)
        run: |
          set -euo pipefail
          dc() { docker compose -f deploy/docker-compose.yml exec -T db "$@"; }
          dc pg_dump -U rgnr8 -d rgnr8 -f /tmp/backup.sql
          dc psql -U rgnr8 -d rgnr8 -c "CREATE DATABASE rgnr8_restore;"
          dc sh -c "psql -U rgnr8 -d rgnr8_restore -f /tmp/backup.sql >/dev/null 2>&1"
          # A restore that silently produced an empty database must FAIL the drill.
          # Verify the governed-migration bookkeeping restored with the SAME row
          # count as the source (and is non-empty).
          src=$(dc psql -U rgnr8 -d rgnr8 -tAc \
            "SELECT count(*) FROM schema_migrations")
          dst=$(dc psql -U rgnr8 -d rgnr8_restore -tAc \
            "SELECT count(*) FROM schema_migrations")
          echo "schema_migrations rows — source=$src restore=$dst"
          if [ "$src" -lt 1 ] || [ "$src" != "$dst" ]; then
            echo "restore drill FAILED: expected $src migration rows, restore has $dst" >&2
            exit 1
          fi
          echo "restore drill OK — verified $dst restored migration rows"
      - name: Dump logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  dependency-audit:
    name: Dependency audit (blocking on high+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm ci
      - name: npm audit (high+)
        run: npm audit --audit-level=high
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: pip-audit on runtime deps
        run: |
          python -m pip install --upgrade pip-audit
          pip-audit -r requirements.txt
